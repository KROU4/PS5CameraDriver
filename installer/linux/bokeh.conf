# PS5 HD Camera: settings of the bokeh service (ps5cam-bokehd, systemd unit ps5camera-bokeh).
# The service applies a change by itself within a second of saving this file. A value outside its
# range is clamped; lines it cannot read are reported in: journalctl -u ps5camera-bokeh
# The picture settings mean the same as in the Windows version (ps5cam-ctl set).

# What "PS5 Camera" shows: 0 bokeh (background blurred by depth), 1 main sensor, 2 second sensor,
# 3 depth, 4 both sensors side by side. 0..4, default 0.
mode = 0

# Background blur strength. 0..100, default 60.
blur = 60

# 1: focus follows the subject by itself; 0: focus stays at the distance set by "focus".
# 0 or 1, default 1.
autofocus = 1

# Focus distance when autofocus = 0: 0 far .. 100 near. Default 50.
focus = 50

# Emphasis of bright spots in the blurred background, percent. 0..400, default 150.
highlights = 150

# How quickly the depth follows motion: low is steadier, 100 is no smoothing. 5..100, default 40.
temporal = 40

# Digital brightening of dim rooms. 0 or 1, default 1.
autobrightness = 1

# The most autobrightness may amplify, in tenths (60 = 6x). 10..160, default 60.
maxgain = 60

# Temporal noise reduction of the picture: 0 off .. 100 strongest. Default 70.
denoise = 70

# Anti-flicker for lamps: 0 auto (on 50 Hz mains a dim room without flickering lamps gets a longer
# exposure), 1 50 Hz, 2 60 Hz, 3 off. Default 0.
antiflicker = 0

# Mains frequency where the camera is used: 50 (Europe, most of Asia, Africa, Australia) or
# 60 (North America, most of South America, Korea, Taiwan, ...). Default 50.
mains = 50

# Frame rate of the camera and of "PS5 Camera": 30 or 60. Default 60.
fps = 60

# 0: the camera and the GPU run only while a program watches "PS5 Camera" (with v4l2loopback older
# than 0.13: while a program has it open). 1: they run whenever the camera is connected, and other
# programs cannot open the camera itself ("USB Camera-OV580"). 0 or 1, default 0.
always_on = 0

# Device node of the camera, e.g. /dev/video0; auto finds the PS5 camera by its USB id.
# Default auto.
camera = auto

# v4l2loopback device to write to; auto takes the one named "PS5 Camera". Default auto.
output = auto
