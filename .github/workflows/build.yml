# Builds the Windows (ZIP and MSI), Linux and macOS packages on every push and pull request. On a
# v* tag (which must match VERSION) the Windows files are signed through SignPath.io (once the
# project is set up there, see .signpath/README.md), all packages are published as a GitHub
# release and the winget manifests for it are left as an artifact. Runs on demand too
# (Actions → Build → Run workflow).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # release upload
  actions: read    # SignPath reads the build artifact and job details

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} but VERSION $version" }

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: Package
        shell: pwsh
        run: ./package.ps1 -NoBuild -Msi

      - name: Upload MSI packages
        uses: actions/upload-artifact@v4
        with:
          name: PS5CameraDriver-msi
          path: |
            dist/PS5CameraDriver.msi
            dist/PS5CameraDriver-ru.msi
          if-no-files-found: error

      - name: Upload unsigned Windows package
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PS5CameraDriver-windows-unsigned
          path: dist/PS5CameraDriver/
          if-no-files-found: error

      - name: Upload Linux and macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: PS5CameraDriver-linux-macos
          path: |
            dist/PS5CameraDriver-linux.zip
            dist/PS5CameraDriver-macos.zip
          if-no-files-found: error

      # Signing needs the SignPath organization (repository variable SIGNPATH_ORGANIZATION_ID) and
      # its API token (secret SIGNPATH_API_TOKEN). Each request waits for manual approval there.
      - name: Sign Windows package (SignPath)
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PS5CameraDriver' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist/signed

      - name: Use the signed Windows package
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item dist/PS5CameraDriver.zip -Force
          Compress-Archive -Path dist/signed/* -DestinationPath dist/PS5CameraDriver.zip
          Get-AuthenticodeSignature dist/signed/*.dll, dist/signed/*.exe, dist/signed/*.ps1 |
            Format-Table Status, @{n = 'File'; e = { Split-Path $_.Path -Leaf } } -AutoSize
          # The MSI packages again, now with the signed files inside.
          ./installer/msi/build-msi.ps1 -Dist dist/signed

      - name: winget manifests
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./installer/winget/make-manifests.ps1 -Version ((Get-Content VERSION -TotalCount 1).Trim())

      - name: Upload winget manifests
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PS5CameraDriver.msi
            dist/PS5CameraDriver-ru.msi
            dist/PS5CameraDriver.zip
            dist/PS5CameraDriver-linux.zip
            dist/PS5CameraDriver-macos.zip
          fail_on_unmatched_files: true
