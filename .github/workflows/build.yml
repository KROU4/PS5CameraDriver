# Builds the Windows (ZIP and MSI), Linux and macOS packages and the Linux bokeh daemon on every
# push and pull request. On a v* tag (which must match VERSION) the Windows files are signed through
# SignPath.io (once the project is set up there, see .signpath/README.md), the daemon goes into the
# Linux package, all packages are published as a GitHub release with their SHA-256 sums and the
# winget manifests for it are left as an artifact. Runs on demand too (Actions → Build → Run
# workflow). Actions are pinned to full commit hashes (Dependabot keeps them current); only the
# release job may write to the repository.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read  # SignPath reads the build artifact and job details
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}  # through the environment: a tag name is not script text
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG but VERSION $version" }

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: CPU and GPU regression tests (WARP)
        shell: pwsh
        run: ctest --test-dir build/Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./package.ps1 -NoBuild -Msi

      - name: Test MSI install, cross-language upgrade and uninstall
        shell: pwsh
        run: ./installer/msi/test-install.ps1 -Dist dist -Out out/msi-test

      - name: Upload MSI test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PS5CameraDriver-msi-test-logs
          path: out/msi-test/
          if-no-files-found: warn

      - name: Upload MSI packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PS5CameraDriver-msi
          path: |
            dist/PS5CameraDriver.msi
            dist/PS5CameraDriver-ru.msi
          if-no-files-found: error

      - name: Upload unsigned Windows package
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PS5CameraDriver-windows-unsigned
          path: dist/PS5CameraDriver/
          if-no-files-found: error

      - name: Upload Linux and macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PS5CameraDriver-linux-macos
          path: |
            dist/PS5CameraDriver-linux.zip
            dist/PS5CameraDriver-macos.zip
          if-no-files-found: error

      # Signing needs the SignPath organization (repository variable SIGNPATH_ORGANIZATION_ID) and
      # its API token (secret SIGNPATH_API_TOKEN). Each request waits for manual approval there.
      - name: Sign Windows package (SignPath)
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PS5CameraDriver' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist/signed

      - name: Use the signed Windows package
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $signatures = Get-AuthenticodeSignature dist/signed/*.dll, dist/signed/*.exe, dist/signed/*.ps1
          $signatures | Format-Table Status, @{n = 'File'; e = { Split-Path $_.Path -Leaf } } -AutoSize
          $bad = $signatures | Where-Object Status -ne 'Valid'
          if ($bad) { throw "not validly signed: $(($bad | ForEach-Object { Split-Path $_.Path -Leaf }) -join ', ')" }
          Remove-Item dist/PS5CameraDriver.zip -Force
          Compress-Archive -Path dist/signed/* -DestinationPath dist/PS5CameraDriver.zip
          # The MSI packages again, now with the signed files inside. The .msi files themselves are
          # not signed yet: that needs a second signing request for them.
          ./installer/msi/build-msi.ps1 -Dist dist/signed

      - name: winget manifests
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./installer/winget/make-manifests.ps1 -Version ((Get-Content VERSION -TotalCount 1).Trim())

      - name: Upload winget manifests
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-windows
          path: |
            dist/PS5CameraDriver.msi
            dist/PS5CameraDriver-ru.msi
            dist/PS5CameraDriver.zip
            dist/PS5CameraDriver-linux.zip
            dist/PS5CameraDriver-macos.zip
          if-no-files-found: error

  # Linux bokeh: the pipeline on Vulkan (shaders compiled by dxc) and ps5cam-bokehd. Built on the
  # oldest supported Ubuntu for the widest glibc compatibility; the tests run it on lavapipe (a CPU
  # Vulkan driver, chosen by name) under the Vulkan validation layers.
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505/linux_dxc_2025_05_24.x86_64.tar.gz
      DXC_SHA256: b99655f65215287825fcdd49102b17e2a1608eff79ffaf9457514c2676892aa5
      PS5CAM_GPU: llvmpipe
      PS5CAM_VK_VALIDATION: '1'
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation  # the loader fails if the layer is missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          curl -fsSL -o /tmp/dxc.tgz "$DXC_URL"
          echo "$DXC_SHA256  /tmp/dxc.tgz" | sha256sum -c -
          sudo mkdir -p /opt/dxc
          sudo tar -xzf /tmp/dxc.tgz -C /opt/dxc
          echo /opt/dxc/bin >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test on lavapipe
        run: |
          # Three frames of noise in the camera's stereo format: no calibration, but every kernel runs,
          # through both outputs; the first Process call only primes the pipeline.
          head -c $((5326848 * 3)) /dev/urandom > /tmp/noise.clip
          ./build/src/linux/ps5cam-bokehd --input /tmp/noise.clip --output /tmp/out.nv12 > /tmp/nv12.log 2>&1 ||
            { cat /tmp/nv12.log; exit 1; }
          ./build/src/linux/ps5cam-bokehd --input /tmp/noise.clip --output /tmp/out.yuy2 --format yuy2 --depthplane 1 \
            > /tmp/yuy2.log 2>&1 || { cat /tmp/yuy2.log; exit 1; }
          cat /tmp/nv12.log /tmp/yuy2.log
          test "$(stat -c %s /tmp/out.nv12)" -eq $((1920 * 1080 * 3 / 2 * 2))
          test "$(stat -c %s /tmp/out.yuy2)" -eq $((1920 * 1080 * 2 * 2))
          test "$(stat -c %s /tmp/out.yuy2.depth)" -eq $((1920 * 1080 * 2))
          if grep -q 'Validation Error' /tmp/nv12.log /tmp/yuy2.log; then exit 1; fi

      - name: Upload ps5cam-bokehd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ps5cam-bokehd
          path: build/src/linux/ps5cam-bokehd
          if-no-files-found: error

  # Exercise the exact macOS ZIP assembled by the Windows packaging job on both supported CPU
  # families. The fixture is generated after checking the package: no Sony firmware is shipped.
  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: PS5CameraDriver-linux-macos
          path: dist

      - name: Inspect package and run firmware-loader CPU tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir package
          unzip -q dist/PS5CameraDriver-macos.zip -d package
          bash -n package/install.sh package/uninstall.sh
          python3 -I tools/tests/test-fwload.py
          /usr/bin/python3 -I tools/tests/test-fwload.py --check-lock "$EXPECTED_ARCH" \
            "/tmp/ps5camera-lock-$EXPECTED_ARCH"
          if find package -type f -name '*.bin' -print -quit | grep -q .; then
            echo "The release package must not contain firmware binaries" >&2
            exit 1
          fi
          python3 -I tools/tests/test-fwload.py --write-fixture package

      - name: Native install, launchd and uninstall smoke test
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          target='/Library/Application Support/PS5Camera'
          plist=/Library/LaunchDaemons/com.ps5camera.fwload.plist
          /usr/bin/python3 -c 'import sys; assert sys.version_info >= (3, 9)'
          sudo bash package/install.sh --bokeh off --original "$PWD/package/sony-firmware.bin"
          plutil -lint "$plist"
          # launchd starts the process asynchronously after bootstrap returns.
          for _ in {1..10}; do
            sudo launchctl print system/com.ps5camera.fwload | tee /tmp/ps5camera-launchd.txt >/dev/null
            grep -q 'state = running' /tmp/ps5camera-launchd.txt && break
            sleep 1
          done
          cat /tmp/ps5camera-launchd.txt
          grep -q 'state = running' /tmp/ps5camera-launchd.txt
          cmp package/requirements.lock "$target/requirements.lock"
          "$target/venv/bin/python" -c \
            'import importlib.metadata as m, sys; assert m.version("pyusb") == "1.3.1"; assert m.version("libusb-package") == "1.0.30.0"; assert m.version("importlib-resources") == "6.5.2"; assert sys.version_info >= (3, 10) or m.version("zipp") == "3.23.1"'
          PYTHONPATH="$target" "$target/venv/bin/python" -c \
            'import ps5cam_fwload; assert ps5cam_fwload.backend() is not None'
          libusb_path="$("$target/venv/bin/python" -c 'import libusb_package; p = libusb_package.find_library("libusb-1.0"); assert p; print(p)')"
          file "$libusb_path"
          file "$libusb_path" | grep -q "$EXPECTED_ARCH"
          test -s "$target/firmware.bin"
          sudo bash "$target/uninstall.sh"
          test ! -e "$target"
          test ! -e "$plist"

      - name: Clean up launchd service
        if: always()
        run: |
          target='/Library/Application Support/PS5Camera'
          plist=/Library/LaunchDaemons/com.ps5camera.fwload.plist
          if [[ -x "$target/uninstall.sh" ]]; then
            sudo bash "$target/uninstall.sh"
          else
            sudo launchctl bootout system "$plist" 2>/dev/null || true
            sudo rm -f "$plist"
            sudo rm -rf "$target"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ps5cam-bokehd
          path: bin

      - name: Add the bokeh daemon to the Linux package
        run: |
          chmod 755 bin/ps5cam-bokehd
          (cd bin && zip -X ../dist/PS5CameraDriver-linux.zip ps5cam-bokehd)
          (cd dist && sha256sum PS5CameraDriver.msi PS5CameraDriver-ru.msi PS5CameraDriver.zip \
            PS5CameraDriver-linux.zip PS5CameraDriver-macos.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/PS5CameraDriver.msi
            dist/PS5CameraDriver-ru.msi
            dist/PS5CameraDriver.zip
            dist/PS5CameraDriver-linux.zip
            dist/PS5CameraDriver-macos.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
