name: Feature request / Идея
description: Suggest an improvement / Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like / Что хотелось бы
      description: The problem it solves and how you imagine it. English or Russian is fine.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / Дополнительно
      description: Programs where it is needed, examples, screenshots.
